name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: go build ./...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dynamic-map:ci
      - name: Smoke test
        run: |
          docker run -d --name dm -p 8080:8080 dynamic-map:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8080/api/v1/groups >/dev/null; then
              echo "ok"
              docker logs dm
              exit 0
            fi
            sleep 1
          done
          docker logs dm
          exit 1
